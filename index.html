<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0820">
<title>어휘 용사 퀴즈 앤 드래곤</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
:root {
  --ink: #fff8e6; --dim: #b9b0d6; --gold: #ffd23f; --red: #ff4d5e; --blue: #3fa9ff; --green: #3ee07a; --yellow: #ffd23f;
  --panel: rgba(16, 10, 44, .92); --edge: #ffcf5a; --edge2: #7a4cff;
  --font: 'Galmuri11', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --fontB: 'Galmuri11 Bold', 'Galmuri11', 'Apple SD Gothic Neo', sans-serif;
  --fontQ: 'Galmuri14', 'Galmuri11', 'Apple SD Gothic Neo', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: manipulation; }
body { color: var(--ink); font-family: var(--font); }
#wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, #1a1040 0%, #000 75%); }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: #0b0820; image-rendering: auto; }
#crt { position: absolute; inset: 0; pointer-events: none; z-index: 90;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.0) 0 2px, rgba(0,0,0,.13) 2px 3px);
  box-shadow: inset 0 0 120px rgba(0,0,0,.55); }
#crt.off { display: none; }
.scr { position: absolute; inset: 0; display: none; }
.scr.on { display: block; }
.bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.px { font-family: var(--font); }
.b { font-family: var(--fontB); }
.blink { animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.shadow { text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
.panel { background: var(--panel); border: 4px solid var(--edge); border-radius: 6px; box-shadow: 0 0 0 4px #000, 0 0 0 8px var(--edge2), 0 10px 30px rgba(0,0,0,.6); }
button { font-family: var(--fontB); cursor: pointer; border: none; color: inherit; }
.abtn { background: linear-gradient(#ffe27a, #ffb52e); color: #3a1d00; font-size: 30px; padding: 14px 34px; border-radius: 10px; border: 4px solid #000; box-shadow: 0 6px 0 #7a4a00, 0 6px 0 4px #000; }
.abtn:active { transform: translateY(5px); box-shadow: 0 1px 0 #7a4a00, 0 1px 0 4px #000; }
.abtn.blue { background: linear-gradient(#8fd3ff, #3f8bff); color: #001a44; box-shadow: 0 6px 0 #133d8a, 0 6px 0 4px #000; }
.abtn.gray { background: linear-gradient(#ddd, #999); color: #222; box-shadow: 0 6px 0 #555, 0 6px 0 4px #000; }
.spr { position: absolute; display: flex; align-items: flex-end; justify-content: center; }
.spr img { width: 100%; height: 100%; object-fit: contain; image-rendering: auto; }
.spr .emo { font-size: 1em; line-height: 1; }

/* ---------- HUD ---------- */
#hud { position: absolute; left: 0; right: 0; top: 0; height: 74px; z-index: 40; display: none; align-items: center; gap: 14px; padding: 0 16px; white-space: nowrap;
  background: linear-gradient(#000e, #000a 75%, #0000); font-family: var(--fontB); font-size: 24px; }
#hud.on { display: flex; }
#hud .who { color: var(--gold); font-size: 22px; }
#hud > * { flex: none; }
#hearts { display: flex; gap: 4px; }
#hearts img, #hearts span { width: 32px; height: 32px; font-size: 28px; line-height: 32px; }
#hud .score { margin-left: auto; text-align: right; line-height: 1.05; }
#hud .score small { display: block; font-size: 16px; color: var(--dim); }
#items { display: flex; gap: 8px; }
.item { background: #0008; border: 2px solid #fff6; border-radius: 8px; padding: 2px 6px; font-size: 20px; }
.item.use { cursor: pointer; border-color: var(--gold); }
.item.zero { opacity: .35; }
#hud .stg { color: #9fe3ff; }
#menuBtn { background: linear-gradient(#ffe27a, #ffb52e); color: #3a1d00; border: 3px solid #000; border-radius: 10px; font-size: 22px; padding: 4px 12px; box-shadow: 0 3px 0 #000; }
#menu { position: absolute; inset: 0; z-index: 80; background: #000b; display: none; align-items: center; justify-content: center; }
#menu .box { width: 520px; padding: 24px 30px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
#menu h2 { margin: 0 0 6px; font-family: var(--fontB); font-size: 44px; color: var(--gold); }
#menu .abtn { font-size: 28px; padding: 12px 20px; }
#selBack { position: absolute; left: 24px; top: 30px; font-size: 24px; padding: 8px 18px; }
#muteBtn { background: #0008; border: 2px solid #fff6; border-radius: 8px; font-size: 22px; padding: 2px 8px; }

/* ---------- 타이틀 ---------- */
#title .logo { position: absolute; left: 0; right: 0; top: 46px; text-align: center; }
#title .logo .t1 { font-family: var(--fontB); font-size: 40px; color: #9fe3ff; letter-spacing: 6px; }
#title .logo .t2 { font-family: var(--fontB); font-size: 104px; line-height: 1.05; color: var(--gold);
  text-shadow: 0 6px 0 #c2410c, 0 10px 0 #000, 5px 5px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000; letter-spacing: 4px; }
#title .logo .t3 { font-family: var(--fontB); font-size: 34px; color: #fff; margin-top: 8px; letter-spacing: 3px; }
#title .push { position: absolute; left: 0; right: 0; top: 470px; text-align: center; font-size: 44px; font-family: var(--fontB); color: #fff; }
#title .credit { position: absolute; right: 30px; bottom: 22px; font-size: 24px; color: var(--dim); }
#title .copy { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font-size: 20px; color: var(--dim); }
#title .hi { position: absolute; left: 30px; bottom: 22px; font-size: 24px; color: var(--gold); }

/* ---------- 선택 ---------- */
#select h2 { position: absolute; top: 34px; left: 0; right: 0; text-align: center; font-family: var(--fontB); font-size: 48px; color: var(--gold); margin: 0; }
#select .sub { position: absolute; top: 100px; left: 0; right: 0; text-align: center; font-size: 24px; color: var(--dim); }
.cards { position: absolute; top: 150px; left: 40px; right: 40px; bottom: 120px; display: flex; gap: 24px; justify-content: center; }
.card { flex: 1; max-width: 520px; position: relative; cursor: pointer; padding: 18px; text-align: center; transition: transform .1s; }
.card.sel { transform: scale(1.04); border-color: #fff; box-shadow: 0 0 0 4px #000, 0 0 0 8px var(--gold), 0 0 40px var(--gold); }
.card .nm { font-family: var(--fontB); font-size: 40px; color: var(--gold); }
.card .ds { font-size: 22px; color: var(--ink); margin-top: 8px; line-height: 1.45; }
.card .face { width: 220px; height: 220px; margin: 10px auto; border-radius: 50%; overflow: hidden; border: 6px solid #fff; background: #ffe7c2; font-size: 150px; line-height: 220px; }
.card .face img { width: 100%; height: 100%; object-fit: cover; }
.cards.heroes .card { max-width: 290px; padding: 12px; }
.cards.heroes .pic { height: 250px; position: relative; }
.cards.heroes .pic .spr { inset: 0; font-size: 170px; }
.cards.heroes .nm { font-size: 32px; }
.cards.heroes .ab { font-size: 20px; color: #9fe3ff; margin-top: 6px; line-height: 1.4; min-height: 84px; }
#select .go { position: absolute; bottom: 28px; left: 0; right: 0; text-align: center; }

/* ---------- 지도 ---------- */
#map svg { position: absolute; inset: 0; }
.node { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 5px solid #000; display: flex; align-items: center; justify-content: center; font-size: 34px; box-shadow: 0 5px 0 #0008; }
.node.mon { background: radial-gradient(#ffb3b3, #e0485a); }
.node.mon.en { background: radial-gradient(#b8e2ff, #2f7fe0); }
.node.inn { background: radial-gradient(#fff1b8, #ffb02e); }
.node.elf { background: radial-gradient(#e6c8ff, #9b4dff); }
.node.chest { background: radial-gradient(#fff3a8, #e0a800); }
.node.dragon { background: radial-gradient(#ffcf9e, #ff5a1f); width: 84px; height: 84px; margin: -42px 0 0 -42px; border-color: #3a0000; }
.node.start { background: radial-gradient(#d9ffd0, #3ec46d); }
.node.boss { background: radial-gradient(#fff, #ffd23f); width: 110px; height: 110px; margin: -55px 0 0 -55px; font-size: 60px; border-color: #5a2a00; }
.node img { width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 2px 0 #000); }
.node.dragon img { width: 80px; height: 80px; }
.node.done { filter: grayscale(.85) brightness(.75); }
.node .tag { position: absolute; right: -10px; top: -10px; background: #000; color: #fff; border-radius: 10px; font-size: 16px; padding: 2px 6px; font-family: var(--fontB); border: 2px solid #fff; }
.node.reach { animation: reach .5s ease-in-out infinite alternate; cursor: pointer; }
@keyframes reach { to { box-shadow: 0 0 0 6px #fff, 0 0 30px #fff; } }
#token { position: absolute; width: 110px; height: 110px; margin: -100px 0 0 -55px; z-index: 5; transition: left .22s, top .22s; pointer-events: none; }
#token .spr { inset: 0; font-size: 80px; }
#token.hop { animation: hop .22s ease-out; }
@keyframes hop { 50% { transform: translateY(-26px); } }
#mapInfo { position: absolute; left: 24px; top: 86px; width: 640px; padding: 14px 20px; }
#mapInfo .sn { font-family: var(--fontB); font-size: 32px; color: var(--gold); }
#mapInfo .sm { font-size: 21px; margin-top: 6px; line-height: 1.4; }
#dicePanel { position: absolute; left: 690px; top: 86px; width: 300px; height: 150px; display: flex; align-items: center; justify-content: center; gap: 14px; }
#dice { width: 110px; height: 110px; background: #fff; color: #c00; border: 5px solid #000; border-radius: 18px; font-family: var(--fontB); font-size: 84px; line-height: 100px; text-align: center; box-shadow: 0 6px 0 #0008; }
#dice.roll { animation: shake .1s linear infinite; }
@keyframes shake { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
#rollBtn { font-size: 26px; padding: 12px 18px; }
#legend { position: absolute; right: 18px; top: 86px; width: 260px; padding: 10px 14px; font-size: 18px; line-height: 1.55; }
#forkMsg { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-family: var(--fontB); font-size: 34px; color: #fff; display: none; z-index: 6; }

/* ---------- 전투 ---------- */
#battle .hero { left: 70px; top: 140px; width: 240px; height: 240px; font-size: 170px; }
#battle .mon { right: 90px; top: 136px; width: 250px; height: 250px; font-size: 190px; }
#battle .mon.boss { right: 50px; top: 118px; width: 310px; height: 310px; font-size: 230px; }
#monName { position: absolute; right: 40px; top: 82px; width: 420px; text-align: center; font-family: var(--fontB); font-size: 26px; z-index: 3; }
#gems { position: absolute; right: 40px; top: 114px; width: 420px; display: flex; justify-content: center; gap: 6px; z-index: 3; }
#gems:not(:empty) { width: auto; right: auto; left: calc(100% - 250px); transform: translateX(-50%); background: #000b; border: 3px solid #ffcf5a; border-radius: 30px; padding: 4px 12px; }
#monName { text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
#gems .gem { width: 40px; height: 40px; }
#gems .gem img { width: 100%; height: 100%; }
#gems .gem span { font-size: 34px; }
#gems .gem.lit { animation: pop .4s; }
@keyframes pop { 50% { transform: scale(1.7); } }
#cat { position: absolute; left: 380px; top: 96px; display: flex; align-items: center; gap: 10px; padding: 8px 18px; font-family: var(--fontB); font-size: 26px; border-radius: 30px; border: 4px solid #000; z-index: 3; }
#cat.ko { background: #ffd6d6; color: #8a0010; }
#cat.en { background: #cfe9ff; color: #003b8a; }
#cat img { width: 40px; height: 40px; }
#ability { position: absolute; left: 380px; top: 152px; font-family: var(--fontB); font-size: 22px; color: #fff; background: #7a2cff; border: 3px solid #000; border-radius: 10px; padding: 4px 12px; z-index: 3; display: none; }
#qbox { position: absolute; left: 40px; right: 40px; top: 322px; max-height: 190px; min-height: 120px; padding: 14px 24px 10px; z-index: 4; }
#qbox.tall { top: 200px; }
#qtext { font-family: var(--fontQ); font-size: 34px; line-height: 1.35; text-align: center; word-break: keep-all; }
#qbig { font-family: var(--fontQ); font-size: 46px; line-height: 1.3; text-align: center; color: var(--gold); margin-top: 6px; word-break: keep-all; }
#qbig.long { font-size: 27px; color: #fff; text-align: left; line-height: 1.55; background: #fff1; padding: 8px 14px; border-radius: 8px; }
#qbig.emo { font-size: 92px; line-height: 1.1; }
#qbig .ko { display: block; font-size: 26px; color: #b9e6ff; margin-top: 4px; }
#speakBtn { position: absolute; right: 12px; top: 10px; font-size: 30px; background: #fff2; border: 3px solid #fff8; border-radius: 12px; padding: 2px 10px; }
#timer { position: absolute; left: 40px; right: 40px; height: 16px; top: 370px; background: #000; border: 3px solid #fff; border-radius: 10px; overflow: hidden; z-index: 4; }
#timer i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, #3ee07a, #ffd23f); }
#timer.warn i { background: #ff4d5e; animation: blink .4s steps(2, start) infinite; }
#qbox.tall + #timer, #timer.tall { top: 184px; }
#choices { position: absolute; left: 40px; right: 40px; bottom: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; z-index: 4; }
.ch { position: relative; min-height: 86px; display: flex; align-items: center; gap: 14px; padding: 10px 18px 10px 12px; text-align: left;
  font-family: var(--fontQ); font-size: 30px; line-height: 1.2; color: #fff; background: #1c1450ee; border: 4px solid #fff; border-radius: 14px; box-shadow: 0 5px 0 #000; word-break: keep-all; }
.ch .k { flex: none; width: 58px; height: 58px; border-radius: 50%; border: 4px solid #000; display: flex; align-items: center; justify-content: center; font-family: var(--fontB); font-size: 30px; color: #000; box-shadow: inset 0 -6px 0 #0004; }
.ch:nth-child(1) .k { background: var(--red); } .ch:nth-child(2) .k { background: var(--blue); } .ch:nth-child(3) .k { background: var(--green); } .ch:nth-child(4) .k { background: var(--yellow); }
.ch.emo { justify-content: center; font-size: 96px; min-height: 150px; }
.ch.emo .k { position: absolute; left: 10px; top: 10px; width: 44px; height: 44px; font-size: 22px; }
.ch.mid { font-size: 25px; }
.ch.small { font-size: 21px; }
.ch:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
.ch.right { background: #0d7a3a; border-color: #8dffb8; animation: pop .35s; }
.ch.wrong { background: #7a0d1c; border-color: #ff9aa6; }
.ch.gone { visibility: hidden; }
.ch.dim { opacity: .45; }
#choices.locked .ch { pointer-events: none; }
#choices.three { grid-template-columns: 1fr 1fr 1fr; }
#choices:not(.three) .ch:nth-child(3):last-child { grid-column: span 2; justify-self: center; width: 50%; }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
.stamp { position: absolute; left: 50%; top: 250px; transform: translate(-50%, -50%) scale(0); font-family: var(--fontB); font-size: 120px; z-index: 31; animation: stamp .9s forwards; white-space: nowrap; }
@keyframes stamp { 15% { transform: translate(-50%, -50%) scale(1.25); } 30%, 80% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
.slash { position: absolute; width: 320px; height: 22px; background: linear-gradient(90deg, #fff0, #fff, #fff0); border-radius: 12px; transform-origin: center; animation: slash .35s forwards; }
@keyframes slash { from { opacity: 1; transform: rotate(-30deg) scaleX(.1); } 60% { opacity: 1; transform: rotate(-30deg) scaleX(1.2); } to { opacity: 0; transform: rotate(-30deg) scaleX(1.2); } }
.dmg { position: absolute; font-family: var(--fontB); font-size: 54px; color: #fff; text-shadow: 3px 3px 0 #000; animation: dmg 1s forwards; }
@keyframes dmg { to { transform: translateY(-90px); opacity: 0; } }
.hitflash { animation: hitflash .45s; }
@keyframes hitflash { 0%, 40% { filter: brightness(3) saturate(0); transform: translateX(14px); } 20%, 60% { transform: translateX(-14px); } 100% { filter: none; transform: none; } }
.lunge { animation: lunge .45s; }
@keyframes lunge { 40% { transform: translateX(260px) scale(1.1); } }
.mlunge { animation: mlunge .45s; }
@keyframes mlunge { 40% { transform: translateX(-260px) scale(1.1); } }
.down { animation: down .9s forwards; }
@keyframes down { 30% { transform: translateY(-30px) rotate(-10deg); } 100% { transform: translateY(120px) rotate(30deg); opacity: 0; } }
.shake { animation: sshake .4s; }
@keyframes sshake { 20% { transform: translate(-10px, 6px); } 40% { transform: translate(10px, -6px); } 60% { transform: translate(-8px, 4px); } 80% { transform: translate(6px, -2px); } }
#explain { position: absolute; left: 40px; right: 40px; bottom: 16px; padding: 16px 26px; z-index: 6; display: none; }
#explain .h { font-family: var(--fontB); font-size: 30px; color: #ff9aa6; }
#explain .a { font-family: var(--fontQ); font-size: 40px; color: var(--green); margin: 6px 0; }
#explain .e { font-family: var(--fontQ); font-size: 24px; line-height: 1.45; color: #fff; }
#explain .nx { position: absolute; right: 20px; bottom: 14px; }
#pickCat { position: absolute; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center; gap: 40px; background: #000a; flex-direction: column; }
#pickCat .row { display: flex; gap: 40px; }
#pickCat .tt { font-family: var(--fontB); font-size: 36px; color: #fff; }

/* ---------- 이벤트(여관·요정·보물) ---------- */
#event .npc { left: 60px; top: 110px; width: 360px; height: 360px; font-size: 240px; }
#event .say { position: absolute; left: 440px; right: 40px; top: 110px; padding: 20px 26px; font-family: var(--fontQ); font-size: 30px; line-height: 1.5; }
#event .btns { position: absolute; left: 440px; right: 40px; top: 400px; display: flex; gap: 20px; flex-wrap: wrap; }
#event .chestimg { left: 560px; top: 300px; width: 240px; height: 240px; font-size: 160px; }

/* ---------- 결과 ---------- */
.center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
#clear .box { width: 860px; padding: 26px 36px; }
#clear h1, #over h1, #ending h1 { font-family: var(--fontB); font-size: 72px; margin: 0 0 10px; color: var(--gold); text-shadow: 4px 4px 0 #000; }
.tally { font-size: 28px; line-height: 1.7; }
.wrongs { max-height: 220px; overflow-y: auto; text-align: left; font-size: 21px; line-height: 1.5; margin: 10px 0; background: #0006; padding: 8px 14px; border-radius: 8px; }
.wrongs b { color: var(--green); }
#over .cnt { font-family: var(--fontB); font-size: 160px; color: #fff; text-shadow: 6px 6px 0 #c00; }
#loading { position: absolute; inset: 0; z-index: 100; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; font-family: var(--fontB); font-size: 40px; }
#loading .bar { width: 600px; height: 26px; border: 4px solid #fff; }
#loading .bar i { display: block; height: 100%; width: 0; background: var(--gold); }
#rotate { position: fixed; inset: 0; z-index: 200; background: #000; color: #fff; display: none; align-items: center; justify-content: center; text-align: center; font: 28px/1.6 var(--fontB); }
@media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="wrap"><div id="stage">

<div id="loading"><div>NOW LOADING</div><div class="bar"><i id="loadBar"></i></div><div id="loadTxt" style="font-size:22px;color:#b9b0d6"></div></div>

<div id="hud">
  <span class="who" id="hudWho"></span>
  <span id="hearts"></span>
  <span class="stg" id="hudStage"></span>
  <span id="items"></span>
  <span class="score"><small>SCORE</small><span id="hudScore">0</span></span>
  <button id="menuBtn" title="메뉴">☰ 메뉴</button>
</div>

<!-- 타이틀 -->
<div class="scr" id="title">
  <div class="bg" style="background-image:url(assets/img/bg_title.webp)"></div>
  <div class="logo">
    <div class="t1 shadow">진표·진서의</div>
    <div class="t2">어휘 용사</div>
    <div class="t3 shadow">QUIZ &amp; DRAGONS</div>
  </div>
  <div class="push shadow blink" id="pushTxt">INSERT COIN</div>
  <div class="hi shadow" id="hiTxt"></div>
  <div class="credit shadow" id="creditTxt">CREDIT 0</div>
</div>

<!-- 선택 -->
<div class="scr" id="select">
  <div class="bg" style="background-image:url(assets/img/bg_title.webp);filter:brightness(.45)"></div>
  <h2 class="shadow" id="selTitle">누가 모험을 떠날까요?</h2>
  <div class="sub shadow" id="selSub"></div>
  <div class="cards" id="cards"></div>
  <div class="go"><button class="abtn" id="selGo">결정!</button></div>
  <button class="abtn gray" id="selBack">◀ 뒤로</button>
</div>

<!-- 지도 -->

function draw(name, list, idf) {
  if (!list.length) return null;

  const ids = list.map(idf), have = new Set(ids);
  let d = DECK[name] || [], id = null;

  if (id == null) { d = shuf(ids); id = d.pop(); }

}

const MEANING_TYPES = ['낱말 뜻', '한자어', '사자성어', '관용어', '속담'];
const wordOf = q => { const m = q.match(/^"([^"]+)"의 뜻은\?$/); return m ? m[1] : null; };
function koVocab(g) {
  const all = (window.KO_VOCAB || []).concat(window.KO_VOCAB2 || []);
  const list = all.filter(x => x[0] === g);
  if (!list.length) return null;
  const [gg, type, q0, a, w, ex, big] = draw('kv' + g, list, x => x[2] + '|' + (x[6] || ''));
  const q = q0.replace(/ \((연습|과일|까닭)\)$/, '');
  seenQ('kv' + q);
  const say = [['k', q.replace(/\(\s*\)/g, '빈칸')]];
  if (big) say.push(['k', big.replace(/\(\s*\)/g, '빈칸')]);
  if (MEANING_TYPES.includes(type)) {
    const same = all.filter(x => x[1] === type && x[3] !== a && Math.abs(x[0] - g) <= 1);
    const word = wordOf(q);
    /* 절반은 거꾸로: 뜻을 보여 주고 낱말 고르기 */
    if (word && Math.random() < 0.5) {
      const others = same.map(x => wordOf(x[2])).filter(x => x && x !== word);
      if (others.length >= 3) {
        const ws = pickWrong(others, word, 3);
        return fromAW({ q: '이런 뜻을 가진 말은?', big: a, a: word, w: ws, tag: type + ' (거꾸로)', hint: '"' + word + '" = ' + a + '. ' + ex, say: [['k', '이런 뜻을 가진 말은?']] });
      }
    }
    /* 보기도 매번 바뀌게: 원래 오답 2개 + 다른 문제의 뜻 1개 */
    const extra = pickWrong(same.map(x => x[3]), a, 1, w);
    const ws = shuf(w).slice(0, extra.length ? 2 : 3).concat(extra);
    return fromAW({ q, big: big || '', a, w: ws, tag: type, hint: ex, say });
  }

function eventInn(i) {
  bgm('inn'); R.board[i].done = true;
  eventScreen('bg_inn', 'npc_inn', '👩‍🍳', '여관에 온 걸 환영해요! 🍲<br>문제를 맞히면 따뜻한 수프로 <b>하트 3개</b>를 채워 줄게요.<br>틀려도 하트 1개는 채워 줘요.',
    [['문제 풀기!', '', () => miniQuiz('inn')], ['그냥 쉬기 (하트 +1)', 'gray', () => { heal(1); backToMap('여관에서 쉬었어요. 하트 +1'); }]]);
  speak([['k', '여관에 온 걸 환영해요!']]);
}
function eventElf(i) {
  R.board[i].done = true; bgm('inn');
  eventScreen('bg_elf', 'npc_elf', '🧚', '반짝반짝~ 나는 요정이야! ✨<br>내 문제를 맞히면 <b>마법 아이템</b>을 줄게!<br>(💡힌트 · 🛡️방패 · 🧪물약 중 하나)',
    [['문제 풀기!', '', () => miniQuiz('elf')], ['지나가기', 'gray', () => backToMap()]]);
  sfx('magic'); speak([['k', '반짝반짝, 나는 요정이야!']]);
}
function eventChest(i) {
  R.board[i].done = true;
  eventScreen('bg_inn', null, '', '보물상자를 발견했어요! 🎁<br>열어 볼까요?', [['열기!', '', () => openChest()]]);
  $('evBg').style.backgroundImage = 'url(' + IMG + 'bg_map_' + R.stage + '.webp)';
  $('evChest').style.display = ''; spr($('evChest'), 'item_chest', '🎁');
}
function openChest() {
  spr($('evChest'), 'item_chest_open', '💰'); sfx('treasure');
  const r = Math.random(); let msg;
  if (r < 0.35) { const p = 500 + rndi(6) * 100; addScore(p); msg = '💰 금화 ' + p + '점!'; }
  else if (r < 0.55) { heal(R.maxHp); msg = '💖 하트가 모두 찼어요!'; }
  else if (r < 0.75) { R.items.hint++; msg = '💡 힌트를 얻었어요!'; }
  else if (r < 0.9) { R.items.potion++; msg = '🧪 물약을 얻었어요!'; }
  else { R.items.shield++; msg = '🛡️ 방패를 얻었어요! 한 번 틀려도 하트가 그대로예요'; }
  hud(); $('evSay').innerHTML = msg; speak([['k', '보물이다!']]);
  $('evBtns').innerHTML = ''; const b = document.createElement('button'); b.className = 'abtn'; b.textContent = '계속 ▶'; b.onclick = () => backToMap(msg); $('evBtns').appendChild(b);
}
function heal(n) { R.hp = Math.min(R.maxHp, R.hp + n); sfx('heal'); hud(); }
function miniQuiz(kind) {
  /* 전투 화면을 빌려 한 문제만 */
  const name = kind === 'inn' ? '여관 주인' : '요정';
  B = { kind: 'event', ev: kind, gems: 0, need: 1, qn: rndi(2), node: R.pos, name, img: kind === 'inn' ? 'npc_inn' : 'npc_elf', emo: kind === 'inn' ? '👩‍🍳' : '🧚' };
  show('battle'); $('batBg').style.backgroundImage = 'url(' + IMG + (kind === 'inn' ? 'bg_inn' : 'bg_elf') + '.webp)';
  spr($('batHero'), 'hero_' + R.hero, HEROES[R.hero].emo); spr($('batMon'), B.img, B.emo); $('batMon').className = 'spr mon';
  $('monName').textContent = name; drawGems();
  nextQuestion();
}
/* 이벤트 문제 결과는 answer() 대신 여기서 */
const _answer = answer;
answer = async function (i) {
  if (!B || B.kind !== 'event') return _answer(i);
  if (B.locked) return;
  const q = B.q; if (i >= 0 && q.gone && q.gone.includes(i)) return;
  B.locked = true; stopVoice(); $('choices').classList.add('locked');
  const btns = [...document.querySelectorAll('#choices .ch')]; const ok = i === q.ans;
  btns[q.ans].classList.add('right'); if (!ok && i >= 0) btns[i].classList.add('wrong');
  let msg;
  if (ok) {
    sfx('correct'); stamp('정답!', '#3ee07a'); R.right++; addScore(200);
    if (B.ev === 'inn') { heal(3); msg = '🍲 맛있는 수프! 하트 +3'; }
    else { const k = pick1(['hint', 'shield', 'potion']); R.items[k]++; sfx('magic'); msg = '✨ 요정의 선물: ' + { hint: '💡 힌트', shield: '🛡️ 방패', potion: '🧪 물약' }[k] + '!'; }
  } else {
    sfx('wrong'); stamp('땡!', '#ff4d5e'); R.wrongs.push(q); R.stageWrongs.push(q);
    if (B.ev === 'inn') { heal(1); msg = '정답은 "' + q.answer + '" · 그래도 하트 +1'; } else msg = '정답은 "' + q.answer + '" · 다음에 또 만나!';
  }
  hud(); if (q.sayAfter || q.answerSay) speak(q.sayAfter || q.answerSay);
  await wait(ok ? 1500 : 2600);
  B = null; backToMap(msg);
};

/* ===================== 스테이지 클리어 / 게임 오버 ===================== */
function stageClear() {
  show('clear'); bgm(''); sfx('stage_clear'); 
  $('clearBg').style.backgroundImage = 'url(' + IMG + 'bg_map_' + R.stage + '.webp)';
  const bonus = R.hp * 500; addScore(bonus);
  const pct = R.stageTotal ? Math.round(R.stageRight / R.stageTotal * 100) : 100;
  $('clearTally').innerHTML = 'STAGE ' + R.stage + ' · ' + STAGES[R.stage].name + ' 정복!<br>맞힌 문제 <b>' + R.stageRight + '</b> / ' + R.stageTotal + ' (' + pct + '%)<br>남은 하트 보너스 ' + R.hp + ' × 500 = <b>' + bonus + '</b><br>SCORE <b>' + R.score + '</b>';
  const ws = R.stageWrongs;
  $('clearWrongs').style.display = ws.length ? '' : 'none';
  $('clearWrongs').innerHTML = '<div style="color:#ffd23f">📒 틀린 문제 다시 보기</div>' + ws.map(q => '· ' + esc(q.q) + (q.big && !q.emo ? ' <span style="color:#ffd23f">' + esc(String(q.big).slice(0, 60)) + '</span>' : '') + ' → <b>' + esc(q.answer) + '</b>' + (q.hint && !q.emo ? ' <span style="color:#b9b0d6">(' + esc(q.hint) + ')</span>' : '')).join('<br>');
  const next = R.stage + 1;
  if (next <= 7) unlock(R.who, R.level, next);
  persist();
  $('clearNext').textContent = R.stage >= 7 ? '엔딩 보기 ▶' : '다음 스테이지 ▶';
  speak([['k', '스테이지 클리어!']]);
}
$('clearNext').addEventListener('click', () => {
  sfx('select');
  if (R.stage >= 7) return ending();
  R.stage++; R.hp = Math.min(R.maxHp, R.hp + 2); startStage();
});
let overId = null;
function gameOver() {
  show('over'); bgm(''); sfx('game_over'); persist();
  let n = 9; $('overCnt').textContent = n; $('overT').textContent = 'CONTINUE?';
  speak([['k', '다시 도전할까요?']]);
  clearInterval(overId);
  overId = setInterval(() => {
    n--; if (n < 0) { clearInterval(overId); $('overT').textContent = 'GAME OVER'; $('overCnt').textContent = ''; $('overMsg').textContent = '';
      $('overBtn').textContent = '처음 화면으로'; return; }
    $('overCnt').textContent = n; sfx('continue');
  }, 1300 * FAST);
  $('overBtn').textContent = '다시 도전!'; $('overMsg').textContent = '버튼을 누르면 하트가 가득 차요!';
}
$('overBtn').addEventListener('click', () => {
  clearInterval(overId);
  if ($('overT').textContent === 'GAME OVER') { persist(); return toTitle(); }
  sfx('coin'); R.continues++; R.hp = R.maxHp; R.score = 0;
  show('battle'); hud(); if (B) { B.locked = false; bgm(B.kind === 'mon' ? 'battle' : 'boss'); nextQuestion(); } else backToMap();
});
function ending() {
  show('ending'); bgm('ending'); sfx('levelup'); persist();
  const pct = R.total ? Math.round(R.right / R.total * 100) : 0;
  $('endTally').innerHTML = '🐉 황금 용왕을 물리쳤어요! 🐉<br>' + KIDS[R.who].name + ' 어휘 용사 탄생!<br><br>맞힌 문제 ' + R.right + ' / ' + R.total + ' (' + pct + '%)<br>다시 도전 ' + R.continues + '번 ' + (R.continues === 0 ? '👑' : '') + '<br>FINAL SCORE <b>' + R.score + '</b>';
  speak([['k', '축하해요! 어휘 용사 탄생!']]);
}
$('endBtn').addEventListener('click', () => { sfx('select'); toTitle(); });

/* ===================== 메뉴 ===================== */
function leave() {
  epoch++; rolling = false; forkKeys = null; stopVoice();
  $('forkMsg').style.display = 'none'; $('pickCat').style.display = 'none'; clearInterval(overId);
  $('fx').innerHTML = ''; B = null;
}
function openMenu() {
  if (!R || !['map', 'battle', 'event'].includes(scene)) return;
  audioInit(); sfx('select');
  $('menuSound').textContent = muted ? '🔊 소리 켜기' : '🔇 소리 끄기';
  $('menu').style.display = 'flex';
}
function closeMenu() { $('menu').style.display = 'none'; }
$('menuBtn').addEventListener('click', e => { e.stopPropagation(); openMenu(); });
$('menu').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act; sfx('select');
  if (act === 'resume') return closeMenu();
  if (act === 'sound') { setMute(!muted); $('menuSound').textContent = muted ? '🔊 소리 켜기' : '🔇 소리 끄기'; return; }
  closeMenu(); leave();
  if (act === 'restart') { R.hp = R.maxHp; startStage(); }
  if (act === 'stage') { $('cards').style.flexWrap = ''; show('select'); toSelectStage(true); }
  if (act === 'kid') toSelectKid();
  if (act === 'level') { show('select'); toSelectLevel(); }
  if (act === 'title') { persist(); toTitle(); }
});
$('selBack').addEventListener('click', () => {
  sfx('select'); stopVoice(); $('cards').style.flexWrap = '';
  if (selStep === 'stage') return toSelectHero();
  if (selStep === 'hero') return toSelectLevel();
  if (selStep === 'level') return toSelectKid();
  toTitle();
});

/* ===================== 키보드 ===================== */
addEventListener('keydown', e => {
  const k = e.code;
  if (k === 'Escape') { if ($('menu').style.display === 'flex') closeMenu(); else openMenu(); return; }
  if ($('menu').style.display === 'flex') return;
  if (scene === 'title' && (k === 'Enter' || k === 'Space' || k === 'KeyZ')) { e.preventDefault(); titlePress(); return; }
  if (scene === 'battle') {
    if ($('explain').style.display === 'block' && (k === 'Enter' || k === 'Space')) { $('exNext').click(); return; }
    const m = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3, KeyA: 0, KeyB: 1, KeyC: 2, KeyD: 3 }[k];
    if (m != null && B && B.q && m < B.q.choices.length) answer(m);
  }
  if (scene === 'map') {
    if (forkKeys && (k === 'ArrowUp' || k === 'ArrowDown')) { forkPick(k === 'ArrowUp' ? 1 : 0); return; }
    if (k === 'Enter' || k === 'Space') { e.preventDefault(); roll(); }
  }
  if (scene === 'select' && k === 'Enter') $('selGo').click();
  if (scene === 'clear' && k === 'Enter') $('clearNext').click();
});

/* ===================== 불러오기 ===================== */
async function preload() {
  const names = ['bg_title', 'hero_warrior', 'hero_wizard', 'hero_amazon', 'hero_ninja', 'heart', 'heart_empty', 'gem_on', 'gem_off', 'icon_ko', 'icon_en'];
  let done = 0;
  await Promise.all(names.map(n => new Promise(r => { const im = new Image(); im.onload = im.onerror = () => { done++; $('loadBar').style.width = (done / names.length * 100) + '%'; r(); }; im.src = IMG + n + '.webp'; })));
  /* 나머지는 뒤에서 천천히 */
  setTimeout(() => {
    const rest = [];
    for (let i = 1; i <= 14; i++) rest.push('mon_' + String(i).padStart(2, '0'));
    for (let i = 1; i <= 7; i++) rest.push('boss_' + i, 'bg_map_' + i, 'bg_battle_' + i);
    rest.push('npc_inn', 'npc_elf', 'item_chest', 'item_chest_open', 'bg_inn', 'bg_elf', 'bg_ending');
    rest.forEach(n => { const im = new Image(); im.src = IMG + n + '.webp'; });
  }, 500);
  $('loading').style.display = 'none';
  toTitle();
}
preload();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

</script>
